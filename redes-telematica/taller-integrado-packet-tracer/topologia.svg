<svg viewBox="0 0 1140 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1140" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="570" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Taller Integrado Telemática II — UCAB</text>
  <text x="570" y="56" text-anchor="middle" font-size="13" fill="#4B5563">Bloque único para VLSM:  192.168.10.0/24   |   OSPF multiárea + DR/BDR · EIGRP · Frame Relay · BGP · Voz IP</text>

  <!-- ===== Region AS 65100 (OSPF) ===== -->
  <rect x="36" y="74" width="528" height="612" rx="14" fill="#E8F1FB" stroke="#2C6FB5" stroke-width="2"/>
  <text x="52" y="96" font-size="14" font-weight="700" fill="#1F4E79">AS 65100 — IGP: OSPF (proceso 1)</text>

  <!-- Area 1 sub-box -->
  <rect x="52" y="112" width="118" height="288" rx="10" fill="none" stroke="#2C6FB5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="111" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#2C6FB5">Área 1</text>

  <!-- Area 0 sub-box -->
  <rect x="196" y="112" width="352" height="540" rx="10" fill="none" stroke="#2C6FB5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="372" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#2C6FB5">Área 0 (backbone · segmento multiacceso → elección DR/BDR)</text>

  <!-- ===== Region AS 65200 (EIGRP) ===== -->
  <rect x="704" y="74" width="398" height="612" rx="14" fill="#EAF7EE" stroke="#2E8B57" stroke-width="2"/>
  <text x="720" y="96" font-size="14" font-weight="700" fill="#216E43">AS 65200 — IGP: EIGRP (AS 10)</text>

  <!-- ===== Links (draw first, under nodes) ===== -->
  <!-- R1-R2 serial -->
  <line x1="146" y1="175" x2="250" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="198" y="166" text-anchor="middle" font-size="10" fill="#374151">.200/30</text>
  <text x="160" y="190" font-size="9" fill="#B45309">DCE</text>
  <!-- R2 to bus -->
  <line x1="285" y1="198" x2="285" y2="332" stroke="#374151" stroke-width="2"/>
  <!-- R3 to bus -->
  <line x1="465" y1="198" x2="465" y2="332" stroke="#374151" stroke-width="2"/>
  <!-- R4 to bus -->
  <line x1="355" y1="420" x2="355" y2="354" stroke="#374151" stroke-width="2"/>
  <!-- R1 to SW1 -->
  <line x1="105" y1="198" x2="106" y2="250" stroke="#374151" stroke-width="2"/>
  <!-- SW1 to PC1 -->
  <line x1="106" y1="272" x2="92" y2="318" stroke="#374151" stroke-width="2"/>
  <!-- R4 to SW4 -->
  <line x1="355" y1="466" x2="355" y2="500" stroke="#374151" stroke-width="2"/>
  <!-- SW4 to PC4 -->
  <line x1="355" y1="522" x2="350" y2="560" stroke="#374151" stroke-width="2"/>
  <!-- R3 to cloud -->
  <line x1="500" y1="175" x2="556" y2="178" stroke="#374151" stroke-width="2"/>
  <!-- cloud to R5 -->
  <line x1="688" y1="178" x2="770" y2="175" stroke="#374151" stroke-width="2"/>
  <!-- R5-R6 serial -->
  <line x1="846" y1="175" x2="958" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="902" y="166" text-anchor="middle" font-size="10" fill="#374151">.204/30</text>
  <text x="852" y="190" font-size="9" fill="#B45309">DCE</text>
  <!-- R5 to SW5 -->
  <line x1="805" y1="198" x2="806" y2="250" stroke="#374151" stroke-width="2"/>
  <!-- SW5 to phones/pc -->
  <line x1="800" y1="272" x2="772" y2="326" stroke="#374151" stroke-width="2"/>
  <line x1="812" y1="272" x2="840" y2="326" stroke="#374151" stroke-width="2"/>
  <!-- R6 to SW6 -->
  <line x1="995" y1="198" x2="996" y2="250" stroke="#374151" stroke-width="2"/>
  <line x1="990" y1="272" x2="962" y2="326" stroke="#374151" stroke-width="2"/>
  <line x1="1002" y1="272" x2="1030" y2="326" stroke="#374151" stroke-width="2"/>

  <!-- Multiaccess bus (switch) -->
  <rect x="235" y="332" width="240" height="22" rx="5" fill="#6B7280"/>
  <text x="355" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">SW_BB  ·  192.168.10.192/29</text>

  <!-- ===== Nodes ===== -->
  <!-- helper style: router -->
  <!-- R1 -->
  <g>
    <rect x="70" y="152" width="72" height="46" rx="9" fill="#1F4E79"/>
    <text x="106" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R1</text>
    <text x="106" y="190" text-anchor="middle" font-size="8.5" fill="#CFE2F5">interno A1</text>
  </g>
  <!-- R2 -->
  <g>
    <rect x="250" y="152" width="72" height="46" rx="9" fill="#1F4E79"/>
    <text x="286" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R2</text>
    <text x="286" y="190" text-anchor="middle" font-size="8.5" fill="#CFE2F5">ABR · BDR</text>
  </g>
  <!-- R3 -->
  <g>
    <rect x="430" y="152" width="72" height="46" rx="9" fill="#0F5C3F"/>
    <text x="466" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R3</text>
    <text x="466" y="190" text-anchor="middle" font-size="8.5" fill="#CDEFDD">DR · ASBR</text>
  </g>
  <!-- R4 -->
  <g>
    <rect x="319" y="420" width="72" height="46" rx="9" fill="#1F4E79"/>
    <text x="355" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R4</text>
    <text x="355" y="458" text-anchor="middle" font-size="8.5" fill="#CFE2F5">A0 · DROTHER</text>
  </g>
  <!-- R5 -->
  <g>
    <rect x="770" y="152" width="76" height="46" rx="9" fill="#0F5C3F"/>
    <text x="808" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R5 (2811)</text>
    <text x="808" y="190" text-anchor="middle" font-size="8.5" fill="#CDEFDD">ASBR · Voz</text>
  </g>
  <!-- R6 -->
  <g>
    <rect x="958" y="152" width="76" height="46" rx="9" fill="#216E43"/>
    <text x="996" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">R6 (2811)</text>
    <text x="996" y="190" text-anchor="middle" font-size="8.5" fill="#CDEFDD">EIGRP · Voz</text>
  </g>

  <!-- LAN1 switch + PC -->
  <rect x="78" y="250" width="56" height="22" rx="4" fill="#9CA3AF"/>
  <text x="106" y="265" text-anchor="middle" font-size="9" fill="#111827">SW1</text>
  <rect x="70" y="318" width="46" height="34" rx="3" fill="#374151"/>
  <text x="93" y="339" text-anchor="middle" font-size="9" fill="#FFFFFF">PC1</text>
  <text x="111" y="372" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1F4E79">LAN1 · .0/26</text>

  <!-- LAN4 switch + PC -->
  <rect x="327" y="500" width="56" height="22" rx="4" fill="#9CA3AF"/>
  <text x="355" y="515" text-anchor="middle" font-size="9" fill="#111827">SW4</text>
  <rect x="332" y="560" width="46" height="34" rx="3" fill="#374151"/>
  <text x="355" y="581" text-anchor="middle" font-size="9" fill="#FFFFFF">PC4</text>
  <text x="355" y="610" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1F4E79">LAN4 · .128/27</text>

  <!-- Frame Relay cloud -->
  <ellipse cx="622" cy="178" rx="66" ry="40" fill="#FBEED2" stroke="#C99A2E" stroke-width="2"/>
  <text x="622" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#8A6D1B">Frame Relay</text>
  <text x="622" y="188" text-anchor="middle" font-size="9.5" fill="#8A6D1B">WAN · .208/30</text>
  <text x="622" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">eBGP</text>
  <text x="622" y="258" text-anchor="middle" font-size="9" fill="#B91C1C">AS 65100 ↔ AS 65200</text>
  <text x="540" y="148" font-size="9" fill="#374151">DLCI 100</text>
  <text x="648" y="148" font-size="9" fill="#374151">DLCI 200</text>

  <!-- LAN5 voice switch + phones -->
  <rect x="778" y="250" width="56" height="22" rx="4" fill="#9CA3AF"/>
  <text x="806" y="265" text-anchor="middle" font-size="9" fill="#111827">SW5</text>
  <rect x="750" y="326" width="44" height="36" rx="4" fill="#B45309"/>
  <text x="772" y="343" text-anchor="middle" font-size="8.5" fill="#FFFFFF">TEL</text>
  <text x="772" y="356" text-anchor="middle" font-size="8.5" fill="#FFFFFF">5101</text>
  <rect x="818" y="326" width="44" height="36" rx="4" fill="#B45309"/>
  <text x="840" y="343" text-anchor="middle" font-size="8.5" fill="#FFFFFF">TEL</text>
  <text x="840" y="356" text-anchor="middle" font-size="8.5" fill="#FFFFFF">5102</text>
  <text x="806" y="384" text-anchor="middle" font-size="9.5" font-weight="600" fill="#216E43">LAN5 (voz) · .64/26</text>

  <!-- LAN6 voice switch + phones -->
  <rect x="968" y="250" width="56" height="22" rx="4" fill="#9CA3AF"/>
  <text x="996" y="265" text-anchor="middle" font-size="9" fill="#111827">SW6</text>
  <rect x="940" y="326" width="44" height="36" rx="4" fill="#B45309"/>
  <text x="962" y="343" text-anchor="middle" font-size="8.5" fill="#FFFFFF">TEL</text>
  <text x="962" y="356" text-anchor="middle" font-size="8.5" fill="#FFFFFF">6101</text>
  <rect x="1008" y="326" width="44" height="36" rx="4" fill="#B45309"/>
  <text x="1030" y="343" text-anchor="middle" font-size="8.5" fill="#FFFFFF">TEL</text>
  <text x="1030" y="356" text-anchor="middle" font-size="8.5" fill="#FFFFFF">6102</text>
  <text x="996" y="384" text-anchor="middle" font-size="9.5" font-weight="600" fill="#216E43">LAN6 (voz) · .160/27</text>

  <!-- Legend -->
  <rect x="704" y="430" width="398" height="246" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.2"/>
  <text x="720" y="452" font-size="12" font-weight="700" fill="#216E43">Plan VLSM desde 192.168.10.0/24</text>
  <text x="720" y="476" font-size="10.5" fill="#1F2937">LAN1  192.168.10.0/26     (/26 = 62 hosts)  GW .1</text>
  <text x="720" y="496" font-size="10.5" fill="#1F2937">LAN5  192.168.10.64/26    (voz+datos)        GW .65</text>
  <text x="720" y="516" font-size="10.5" fill="#1F2937">LAN4  192.168.10.128/27   (/27 = 30 hosts)  GW .129</text>
  <text x="720" y="536" font-size="10.5" fill="#1F2937">LAN6  192.168.10.160/27   (voz+datos)        GW .161</text>
  <text x="720" y="556" font-size="10.5" fill="#1F2937">Backbone A0  192.168.10.192/29  R2 .193 · R3 .194 · R4 .195</text>
  <text x="720" y="576" font-size="10.5" fill="#1F2937">Enlace R1-R2  192.168.10.200/30   .201 / .202</text>
  <text x="720" y="596" font-size="10.5" fill="#1F2937">Enlace R5-R6  192.168.10.204/30   .205 / .206</text>
  <text x="720" y="616" font-size="10.5" fill="#1F2937">Frame Relay  192.168.10.208/30   R3 .209 · R5 .210</text>
  <line x1="720" y1="628" x2="1086" y2="628" stroke="#D1D5DB" stroke-width="1"/>
  <text x="720" y="648" font-size="9.5" fill="#6B7280">Routers de borde (R3, R5) = 2811 para BGP/Voz. Resto = 2620XM.</text>
  <text x="720" y="664" font-size="9.5" fill="#6B7280">Switches de voz (SW5, SW6) = 2960-24 · Teléfonos IP = 7960.</text>
</svg>
